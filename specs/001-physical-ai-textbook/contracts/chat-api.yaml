openapi: 3.1.0
info:
  title: Physical AI Textbook - Chat API
  description: RAG-powered chatbot for answering questions about textbook content
  version: 1.0.0

servers:
  - url: https://api.physicalai-textbook.com/v1
    description: Production API
  - url: http://localhost:8000/v1
    description: Local development

tags:
  - name: Chat
    description: Chatbot interactions and message history

paths:
  /chat/session:
    post:
      tags: [Chat]
      summary: Create a new chat session
      description: Start a new conversation session (authenticated or anonymous)
      operationId: createSession
      security:
        - BearerAuth: []
        - {}  # Optional auth
      responses:
        '201':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'

  /chat/session/{session_id}:
    get:
      tags: [Chat]
      summary: Get chat session history
      description: Retrieve all messages in a chat session
      operationId: getSessionHistory
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Chat session ID
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Session history retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatHistory'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /chat/message:
    post:
      tags: [Chat]
      summary: Send a message to the chatbot
      description: Ask a question and receive AI-generated response with citations
      operationId: sendMessage
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      responses:
        '200':
          description: Response generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
        '400':
          description: Invalid request (e.g., empty message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: LLM service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /chat/stream:
    post:
      tags: [Chat]
      summary: Stream chatbot response (SSE)
      description: Send message and receive streaming response via Server-Sent Events
      operationId: streamMessage
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      responses:
        '200':
          description: Streaming response
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-sent events stream with chunks of response
                example: |
                  data: {"chunk": "ROS 2 is", "done": false}
                  data: {"chunk": " a middleware", "done": false}
                  data: {"chunk": "", "done": true, "citations": [...]}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ChatSession:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        created_at:
          type: string
          format: date-time
          example: "2025-12-10T15:30:00Z"
        is_active:
          type: boolean
          example: true

    ChatMessageRequest:
      type: object
      required: [session_id, message]
      properties:
        session_id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        message:
          type: string
          minLength: 1
          maxLength: 2000
          example: "How do I create a ROS 2 publisher?"
          description: User's question
        context:
          type: object
          properties:
            current_chapter:
              type: string
              example: "module-1/03-first-node"
              description: Chapter user is currently reading (optional, for context)
            user_level:
              type: string
              enum: [beginner, intermediate, advanced]
              example: "beginner"
              description: User proficiency (for personalized responses)
          description: Optional context to improve response quality

    ChatMessageResponse:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        session_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [assistant]
          example: "assistant"
        content:
          type: string
          example: "To create a ROS 2 publisher, you need to..."
          description: AI-generated response
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
          description: References to textbook chapters used in response
        token_count:
          type: integer
          example: 247
          description: Total tokens used for this interaction
        created_at:
          type: string
          format: date-time
          example: "2025-12-10T15:31:42Z"

    ChatHistory:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChatMessage:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system]
          example: "user"
        content:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
          nullable: true
        created_at:
          type: string
          format: date-time

    Citation:
      type: object
      properties:
        chapter_id:
          type: string
          example: "module-1/02-installation"
          description: Chapter path identifier
        chapter_title:
          type: string
          example: "Installing ROS 2 Humble"
          description: Human-readable chapter title
        module:
          type: string
          example: "ros2"
          description: Parent module name
        excerpt:
          type: string
          example: "To install ROS 2 Humble on Ubuntu 22.04..."
          description: Relevant text excerpt (max 200 chars)
        relevance_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.89
          description: Similarity score from vector search
        url:
          type: string
          format: uri
          example: "/docs/module-1/02-installation#setup"
          description: Deep link to chapter section

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Message cannot be empty"
        error_code:
          type: string
          example: "CHAT_001"
        details:
          type: object
          additionalProperties: true
